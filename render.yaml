# Blueprint for the free, card-free deployment.
#
# Two web services on render's free plan (no credit card). The database lives on
# supabase or neon (DATABASE_URL) and the worker loop runs as a scheduled github
# action, so nothing here is a paid resource.
#
# Render cannot send mail on smtp ports on the free plan, so both services use
# brevo's https api (BREVO_API_KEY) instead.

services:
  - type: web
    name: zapier-api
    runtime: node
    plan: free
    rootDir: primary-backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_ENDPOINT
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: zapier-hooks
    runtime: node
    plan: free
    rootDir: hooks
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
